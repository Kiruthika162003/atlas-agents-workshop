<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atlas</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<aside>
  <header>
    <span class="dots"><i></i><i></i><i></i><i></i></span>
    <div>
      <h1>Atlas</h1>
      <p>Tell me where you are. I'll tell you what's worth the walk.</p>
    </div>
    <span class="model" title="The model, and the Cloud Run instance that answered last">{{ model }} &middot; instance <span id="instance">{{ instance }}</span></span>
  </header>

  <div id="chat"></div>

  <form id="ask">
    <button type="button" id="here" title="Use my location" aria-label="Use my location">
      <svg viewBox="0 0 24 24" width="18" height="18"><circle cx="12" cy="12" r="3.5" fill="currentColor"/><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 1v4M12 19v4M1 12h4M19 12h4" stroke="currentColor" stroke-width="2"/></svg>
    </button>
    <input id="q" autocomplete="off" placeholder="I'm at Grand Central Market, Los Angeles. Find me food.">
    <button type="submit" id="send" aria-label="Send">
      <svg viewBox="0 0 24 24" width="18" height="18"><path d="M3 20l18-8L3 4v6l12 2-12 2z" fill="currentColor"/></svg>
    </button>
  </form>
</aside>
<div id="map"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
